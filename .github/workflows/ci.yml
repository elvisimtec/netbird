name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create stub config files for validation
        run: |
          # Production config files contain secrets and are never committed.
          # Create minimal stubs so docker compose config can validate syntax.
          echo "# CI stub — real file is server-only" > config.yaml
          echo "NB_DOMAIN=ci" > dashboard.env
          echo "NB_PROXY_TOKEN=ci" > proxy.env

      - name: Validate Docker Compose structure
        run: |
          docker compose -f docker-compose.yml config --quiet
        continue-on-error: false

  lint:
    name: Lint Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint YAML files
        run: |
          pip install yamllint -q
          cat > .yamllint.yml << 'YAMLEOF'
          extends: default
          rules:
            line-length: disable
            document-start: disable
            truthy: disable
          YAMLEOF
          yamllint .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2@0.23.2

      - name: Lint Markdown files
        run: markdownlint-cli2 "*.md" "docs/**/*.md"
        continue-on-error: true

  check-secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for potential secrets in tracked files
        run: |
          ! grep -rE 'NB_PROXY_TOKEN\s*=\s*[a-zA-Z0-9_\-]{10,}|authSecret:\s*[a-zA-Z0-9+/=]{20,}|encryptionKey:\s*[a-zA-Z0-9+/=]{20,}' \
            --include='*.yml' --include='*.yaml' --include='*.md' --include='*.env' \
            . || (echo "ERROR: Potential secrets found in tracked files!" && exit 1)

  all-checks-pass:
    name: All Checks Pass
    needs: [validate, lint, check-secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "Validate failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint failed"
            exit 1
          fi
          if [[ "${{ needs.check-secrets.result }}" != "success" ]]; then
            echo "Secret check failed"
            exit 1
          fi
          echo "All checks passed!"

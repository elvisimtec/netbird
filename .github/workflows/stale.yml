name: Stale Issue Management

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC daily
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # Issue settings
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-message: |
            This issue has been marked as stale because it has been open for 60 days with no activity.
            If this is still relevant, please comment to keep it open.
            The issue will be closed in 7 days if no further activity occurs.
          close-issue-message: |
            This issue was closed because it has been inactive for 7 days since being marked as stale.
            Feel free to reopen if this is still relevant.
          # Labels
          stale-issue-label: "stale"
          close-issue-label: "auto-closed"
          # Exemptions
          exempt-issue-labels: "pinned,security,bug,enhancement"
          exempt-all-issue-assignees: false
          # PR settings — don't stale PRs
          days-before-pr-stale: -1
          days-before-pr-close: -1
          # Other
          ascending: true
          operations-per-run: 30
